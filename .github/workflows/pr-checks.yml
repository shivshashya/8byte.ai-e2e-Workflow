name: PR checks 

# Runs on every pull request that targets main. Nothing is built or deployed
# here; the goal is to stop a broken or vulnerable change before it merges.
on:
  pull_request:
    branches: [main]

# The jobs only read the code, so the workflow token gets read access only.
permissions:
  contents: read

# A new push to the same pull request cancels the run for the previous push.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The application lives in app/, so every run step starts there.
defaults:
  run:
    working-directory: app

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    # Stop a hung job early; the default limit is six hours of runner time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: app/pom.xml

      # Everything except the classes named *IntegrationTests. These need no
      # Docker and no external database.
      - name: Run unit tests
        run: ./mvnw -B test -Dtest='!*IntegrationTests'

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    # Stop a hung job early; the default limit is six hours of runner time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: app/pom.xml

      # These start the whole application. Two of the classes start a real
      # PostgreSQL and MySQL in Docker, which the runner provides.
      - name: Run integration tests
        run: ./mvnw -B test -Dtest='*IntegrationTests'

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    # Stop a hung job early; the default limit is six hours of runner time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: app/pom.xml

      # Download the dependencies first so the scanner reads them from the local
      # Maven repository instead of querying Maven Central, which rate-limits.
      - name: Resolve dependencies
        run: ./mvnw -B -q dependency:resolve

      # Report only: list every HIGH and CRITICAL finding in the job log.
      - name: Report HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: app
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"

      # Gate: fail the pull request on a CRITICAL finding that has a fixed
      # version available, because that one can be resolved by upgrading.
      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: app
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  notify-failure:
    name: Email on failure
    # Runs only when at least one of the checks above failed.
    needs: [unit-tests, integration-tests, dependency-scan]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only this job may request AWS credentials, and its role can do nothing
    # except publish to the failure topic.
    permissions:
      id-token: write
    steps:
      - name: Get AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_NOTIFY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # SNS delivers the message to the email address subscribed to the topic.
      - name: Publish failure message
        working-directory: .
        # Text chosen by the pull request author is passed as environment
        # variables, never pasted into the script itself.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          aws sns publish \
            --topic-arn "${{ vars.SNS_TOPIC_ARN }}" \
            --subject "PR checks failed: ${{ github.repository }} #${{ github.event.pull_request.number }}" \
            --message "Pull request #${{ github.event.pull_request.number }} ($PR_TITLE) failed its checks.
          Branch: $PR_BRANCH
          Commit: ${{ github.event.pull_request.head.sha }}
          Started by: ${{ github.actor }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
