<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1270" viewBox="0 0 1800 1270" role="img" aria-labelledby="title desc">
<title id="title">8Byte.ai DevOps Assignment - High-Level Architecture</title>
<desc id="desc">Spring PetClinic on one private EC2 host with staging and production containers, one private Single-AZ PostgreSQL RDS instance with separate databases, an HTTP ALB across two public subnets, SSH through an Instance Connect Endpoint, and GitHub Actions release automation. Managed services include ECR, Secrets Manager, CloudWatch, S3 and SNS. This describes repository configuration; the demo infrastructure was removed.</desc>
